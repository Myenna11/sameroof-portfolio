<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Same Roof</title>
<style>
  :root {
    --bg: #0d0d0d;
    --bg-panel: #141414;
    --bg-hover: #1c1c1c;
    --bg-input: #1a1a1a;
    --border: #262626;
    --text: #e5e5e5;
    --text-dim: #737373;
    --text-muted: #525252;
    --accent: #3b82f6;
    --accent-dim: #1e3a5f;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --purple: #a855f7;
    --radius: 6px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: 'SF Mono', Menlo, Monaco, 'Courier New', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ===== Layout ===== */
  .sidebar {
    width: 260px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .detail {
    width: 320px;
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: none;
    flex-direction: column;
    flex-shrink: 0;
  }
  .detail.open { display: flex; }

  /* ===== Sidebar ===== */
  .sidebar-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-header .logo { width: 20px; height: 20px; border-radius: 4px; background: var(--accent); }

  .sidebar-section {
    padding: 12px 16px 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 600;
  }

  .agent-item {
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .agent-item:hover { background: var(--bg-hover); }
  .agent-item.selected { background: var(--accent-dim); }
  .agent-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
  .agent-dot.online { background: var(--green); }
  .agent-name { font-weight: 500; flex: 1; }
  .agent-model { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
  .agent-species { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--border); color: var(--text-dim); }

  .task-item {
    padding: 6px 16px;
    font-size: 13px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    cursor: pointer;
  }
  .task-item:hover { background: var(--bg-hover); }
  .task-state { font-size: 10px; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; margin-top: 2px; }
  .task-state.open { background: var(--accent-dim); color: var(--accent); }
  .task-state.doing { background: #3d3d1a; color: var(--yellow); }
  .task-state.done { background: #1a3d1a; color: var(--green); }
  .task-state.blocked { background: #3d1a1a; color: var(--red); }
  .task-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-owner { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }

  /* ===== Main: message stream ===== */
  .stream-header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .stream-title { font-weight: 600; }
  .stream-stats { font-size: 12px; color: var(--text-dim); font-family: var(--mono); }

  .stream {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .msg {
    padding: 8px 12px;
    border-radius: var(--radius);
    max-width: 85%;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .msg-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    font-size: 12px;
  }
  .msg-from { font-weight: 600; }
  .msg-from.human { color: var(--accent); }
  .msg-from.agent { color: var(--purple); }
  .msg-from.system { color: var(--text-dim); }
  .msg-time { color: var(--text-muted); font-family: var(--mono); font-size: 11px; }
  .msg-kind { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--border); color: var(--text-dim); }

  .msg-text { white-space: pre-wrap; word-break: break-word; }
  .msg-text code { font-family: var(--mono); background: var(--bg-input); padding: 1px 4px; border-radius: 3px; font-size: 13px; }
  .msg-text pre { font-family: var(--mono); background: var(--bg-input); padding: 10px; border-radius: var(--radius); overflow-x: auto; margin: 6px 0; font-size: 13px; }

  .msg.human { align-self: flex-end; background: var(--accent-dim); }
  .msg.agent { align-self: flex-start; background: var(--bg-panel); border: 1px solid var(--border); }
  .msg.system { align-self: center; background: transparent; color: var(--text-dim); font-size: 12px; max-width: 100%; text-align: center; padding: 4px 12px; }

  /* Fold-out: DM, tool call, approval, dispatch */
  .fold {
    align-self: flex-start;
    max-width: 85%;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    animation: fadeIn 0.15s ease;
  }
  .fold-header {
    padding: 6px 12px;
    background: var(--bg-panel);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 12px;
    user-select: none;
  }
  .fold-header:hover { background: var(--bg-hover); }
  .fold-icon { color: var(--text-dim); font-size: 10px; transition: transform 0.15s; }
  .fold.open .fold-icon { transform: rotate(90deg); }
  .fold-label { flex: 1; }
  .fold-label .arrow { color: var(--text-muted); margin: 0 4px; }
  .fold-badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; }
  .fold-badge.dm { background: #2d1a3d; color: var(--purple); }
  .fold-badge.dispatch { background: var(--accent-dim); color: var(--accent); }
  .fold-badge.approval { background: #3d3d1a; color: var(--yellow); }
  .fold-badge.result { background: #1a3d1a; color: var(--green); }
  .fold-body {
    display: none;
    padding: 10px 12px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--mono);
    max-height: 400px;
    overflow-y: auto;
  }
  .fold.open .fold-body { display: block; }

  /* Approval card */
  .approval-card {
    align-self: flex-start;
    max-width: 85%;
    border: 1px solid var(--yellow);
    border-radius: var(--radius);
    padding: 12px;
    background: #1a1a0d;
    animation: fadeIn 0.15s ease;
  }
  .approval-header { font-weight: 600; margin-bottom: 6px; color: var(--yellow); font-size: 13px; }
  .approval-detail { font-family: var(--mono); font-size: 12px; color: var(--text-dim); margin-bottom: 10px; white-space: pre-wrap; }
  .approval-actions { display: flex; gap: 8px; }
  .btn {
    padding: 5px 14px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font);
  }
  .btn:hover { background: var(--bg-hover); }
  .btn.allow { border-color: var(--green); color: var(--green); }
  .btn.allow:hover { background: #1a3d1a; }
  .btn.deny { border-color: var(--red); color: var(--red); }
  .btn.deny:hover { background: #3d1a1a; }

  /* ===== Input ===== */
  .input-area {
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    background: var(--bg-panel);
  }
  .input-hint { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-family: var(--mono); }
  .input-hint kbd { background: var(--border); padding: 0 4px; border-radius: 2px; }
  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  .input-field {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    resize: none;
    min-height: 40px;
    max-height: 200px;
    outline: none;
  }
  .input-field:focus { border-color: var(--accent); }
  .btn-send {
    padding: 10px 18px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: white;
    font-weight: 500;
    cursor: pointer;
    font-size: 14px;
  }
  .btn-send:hover { opacity: 0.9; }
  .btn-send:disabled { opacity: 0.4; cursor: default; }

  /* ===== Detail panel ===== */
  .detail-header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .detail-close { cursor: pointer; color: var(--text-dim); font-size: 18px; }
  .detail-body { flex: 1; overflow-y: auto; padding: 16px; font-size: 13px; }
  .detail-row { margin-bottom: 12px; }
  .detail-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
  .detail-value { font-family: var(--mono); font-size: 13px; }

  /* ===== Login ===== */
  .login {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .login-box { width: 360px; text-align: center; }
  .login-box h1 { font-size: 24px; margin-bottom: 4px; }
  .login-box p { color: var(--text-dim); margin-bottom: 24px; font-size: 13px; }
  .login-box input {
    width: 100%; padding: 10px 12px; margin-bottom: 10px;
    background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-family: var(--mono); font-size: 13px; outline: none;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box .btn-send { width: 100%; }
  .login-error { color: var(--red); font-size: 12px; margin-top: 8px; display: none; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  @media (max-width: 800px) {
    .sidebar { display: none; }
    .detail { display: none !important; }
    .msg, .fold, .approval-card { max-width: 100%; }
  }
</style>
</head>
<body>

<!-- Login -->
<div class="login" id="login">
  <div class="login-box">
    <h1>Same Roof</h1>
    <p>Multi-provider agent runtime</p>
    <input id="login-url" placeholder="Coordinator URL" value="">
    <input id="login-token" placeholder="Bearer token" type="password">
    <button class="btn-send" onclick="app.login()">Connect</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header"><div class="logo"></div> Same Roof</div>
  <div class="sidebar-section">Agents</div>
  <div id="agents"></div>
  <div class="sidebar-section" style="margin-top: 12px">Tasks</div>
  <div id="tasks" style="flex:1; overflow-y:auto"></div>
</div>

<!-- Main -->
<div class="main">
  <div class="stream-header">
    <div class="stream-title" id="stream-title">Workspace</div>
    <div class="stream-stats" id="stream-stats"></div>
  </div>
  <div class="stream" id="stream"></div>
  <div class="input-area">
    <div class="input-hint"><kbd>@agent</kbd> mention &nbsp; <kbd>/dispatch agent task</kbd> assign task &nbsp; <kbd>Enter</kbd> send &nbsp; <kbd>Shift+Enter</kbd> newline</div>
    <div class="input-row">
      <textarea class="input-field" id="input" placeholder="Message or /dispatch <agent> <task>..." rows="1"></textarea>
      <button class="btn-send" id="btn-send" onclick="app.send()">Send</button>
    </div>
  </div>
</div>

<!-- Detail panel -->
<div class="detail" id="detail">
  <div class="detail-header">
    <span id="detail-title">Details</span>
    <span class="detail-close" onclick="app.closeDetail()">×</span>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<script>
const app = {
  url: '', token: '', me: null, members: [], tasks: [], sse: null, seenIds: new Set(),

  init() {
    const saved = localStorage.getItem('sameroof-console');
    if (saved) {
      try { const { url, token } = JSON.parse(saved); document.getElementById('login-url').value = url; document.getElementById('login-token').value = token; } catch {}
    }
    if (!document.getElementById('login-url').value) document.getElementById('login-url').value = location.origin;
    document.getElementById('input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.send(); }
    });
    document.getElementById('input').addEventListener('input', e => {
      e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 200) + 'px';
    });
  },

  async login() {
    this.url = document.getElementById('login-url').value.replace(/\/$/, '');
    this.token = document.getElementById('login-token').value;
    const err = document.getElementById('login-error');
    try {
      this.me = await this.api('GET', '/me');
      localStorage.setItem('sameroof-console', JSON.stringify({ url: this.url, token: this.token }));
      document.getElementById('login').style.display = 'none';
      this.start();
    } catch (e) {
      err.textContent = 'Connection failed: ' + e.message; err.style.display = 'block';
    }
  },

  async api(method, path, body) {
    const res = await fetch(this.url + path, {
      method, headers: { 'Authorization': 'Bearer ' + this.token, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error?.message || res.statusText); }
    return res.json();
  },

  async start() {
    await this.loadMembers();
    await this.loadTasks();
    await this.loadHistory();
    this.connectSSE();
    setInterval(() => { this.loadMembers(); this.loadTasks(); }, 15000);
  },

  async loadMembers() {
    this.members = await this.api('GET', '/members').catch(() => []);
    const el = document.getElementById('agents');
    el.innerHTML = this.members.map(m => `
      <div class="agent-item" onclick="app.showAgent('${m.id}')">
        <div class="agent-dot ${m.online ? 'online' : ''}"></div>
        <div style="flex:1; min-width:0">
          <div class="agent-name">${this.esc(m.name)}</div>
          ${m.species === 'agent' ? `<div class="agent-model">${m.model ? this.esc(m.model.provider + '/' + m.model.id) : 'agent'}</div>` : ''}
        </div>
        <span class="agent-species">${m.species === 'human' ? 'you' : 'AI'}</span>
      </div>
    `).join('');
    const online = this.members.filter(m => m.online).length;
    document.getElementById('stream-stats').textContent = `${online}/${this.members.length} online`;
  },

  async loadTasks() {
    this.tasks = await this.api('GET', '/tasks').catch(() => []);
    const el = document.getElementById('tasks');
    const active = this.tasks.filter(t => ['open', 'doing', 'blocked'].includes(t.state));
    el.innerHTML = active.length ? active.map(t => `
      <div class="task-item" onclick="app.showTask('${t.id}')">
        <span class="task-state ${t.state}">${t.state}</span>
        <span class="task-title" title="${this.esc(t.title)}">${this.esc(t.title)}</span>
        <span class="task-owner">${this.esc(t.owner || '')}</span>
      </div>
    `).join('') : '<div style="padding:8px 16px; color:var(--text-muted); font-size:12px">No active tasks</div>';
  },

  async loadHistory() {
    const msgs = await this.api('GET', '/admin/messages?limit=100').catch(() => this.api('GET', '/history?limit=100').catch(() => []));
    for (const m of msgs) this.render(m, false);
    this.scrollBottom();
  },

  connectSSE() {
    if (this.sse) this.sse.close();
    const es = new EventSource(this.url + '/events?token=' + encodeURIComponent(this.token));
    // Note: EventSource doesn't support custom headers. In production, pass token as query param
    // or use fetch-based SSE. For now, coordinator must accept ?token=. Fallback: poll.
    es.onmessage = e => { try { this.render(JSON.parse(e.data), true); } catch {} };
    es.onerror = () => { es.close(); setTimeout(() => this.connectSSE(), 3000); };
    this.sse = es;
  },

  render(m, live) {
    if (this.seenIds.has(m.id)) return;
    this.seenIds.add(m.id);
    const stream = document.getElementById('stream');
    const from = this.members.find(x => x.id === m.from_id) || { name: m.from_id, species: m.from_id === 'house' ? 'system' : 'agent' };
    const to = m.to_id ? (this.members.find(x => x.id === m.to_id) || { name: m.to_id }) : null;
    const time = new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    let html = '';

    if (m.kind === 'dm') {
      // DM fold-out
      const badge = m.meta?.dispatch ? 'dispatch' : 'dm';
      html = `<div class="fold" id="msg-${m.id}">
        <div class="fold-header" onclick="this.parentElement.classList.toggle('open')">
          <span class="fold-icon">▶</span>
          <span class="fold-label"><b>${this.esc(from.name)}</b><span class="arrow">→</span><b>${this.esc(to?.name || '?')}</b></span>
          <span class="fold-badge ${badge}">${badge}</span>
          <span class="msg-time">${time}</span>
        </div>
        <div class="fold-body">${this.fmt(m.text)}</div>
      </div>`;
    } else if (m.kind === 'result') {
      html = `<div class="fold" id="msg-${m.id}">
        <div class="fold-header" onclick="this.parentElement.classList.toggle('open')">
          <span class="fold-icon">▶</span>
          <span class="fold-label">Gateway result → <b>${this.esc(to?.name || '?')}</b></span>
          <span class="fold-badge result">result</span>
          <span class="msg-time">${time}</span>
        </div>
        <div class="fold-body">${this.fmt(m.text)}</div>
      </div>`;
    } else if (m.kind === 'system' && m.meta?.approval_id) {
      // Approval card
      html = `<div class="approval-card" id="msg-${m.id}">
        <div class="approval-header">⚠ ${this.esc(from.name)} requests: ${this.esc(m.meta.action)}</div>
        <div class="approval-detail">${this.esc(JSON.stringify(m.meta.params || {}, null, 2))}</div>
        <div class="approval-actions">
          <button class="btn allow" onclick="app.decide('${m.meta.approval_id}', 'allow', this)">Allow</button>
          <button class="btn deny" onclick="app.decide('${m.meta.approval_id}', 'deny', this)">Deny</button>
        </div>
      </div>`;
    } else if (m.kind === 'system') {
      html = `<div class="msg system" id="msg-${m.id}">${this.esc(m.text)}</div>`;
    } else {
      const cls = from.species === 'human' ? 'human' : from.species === 'system' ? 'system' : 'agent';
      html = `<div class="msg ${cls}" id="msg-${m.id}">
        <div class="msg-meta">
          <span class="msg-from ${cls}">${this.esc(from.name)}</span>
          <span class="msg-time">${time}</span>
        </div>
        <div class="msg-text">${this.fmt(m.text)}</div>
      </div>`;
    }
    stream.insertAdjacentHTML('beforeend', html);
    if (live) this.scrollBottom();
  },

  async send() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;
    input.value = ''; input.style.height = 'auto';

    // /dispatch <agent> <task>
    const dm = text.match(/^\/dispatch\s+(\S+)\s+(.+)$/s);
    if (dm) {
      try { await this.api('POST', '/dispatch', { to: dm[1], task: dm[2] }); await this.loadTasks(); }
      catch (e) { this.toast('Dispatch failed: ' + e.message); }
      return;
    }

    // /dm <agent> <text>
    const dmm = text.match(/^\/dm\s+(\S+)\s+(.+)$/s);
    if (dmm) {
      try { await this.api('POST', '/dm', { to: dmm[1], text: dmm[2] }); }
      catch (e) { this.toast('DM failed: ' + e.message); }
      return;
    }

    try { await this.api('POST', '/say', { text }); }
    catch (e) { this.toast('Send failed: ' + e.message); }
  },

  async decide(approvalId, decision, btn) {
    btn.disabled = true;
    try {
      await this.api('POST', '/approval/' + approvalId, { decision });
      const card = btn.closest('.approval-card');
      card.querySelector('.approval-actions').innerHTML = `<span style="color:var(--${decision === 'allow' ? 'green' : 'red'})">${decision === 'allow' ? '✓ Allowed' : '✗ Denied'}</span>`;
    } catch (e) { btn.disabled = false; this.toast('Failed: ' + e.message); }
  },

  showAgent(id) {
    const m = this.members.find(x => x.id === id); if (!m) return;
    document.getElementById('detail-title').textContent = m.name;
    document.getElementById('detail-body').innerHTML = `
      <div class="detail-row"><div class="detail-label">ID</div><div class="detail-value">${this.esc(m.id)}</div></div>
      <div class="detail-row"><div class="detail-label">Type</div><div class="detail-value">${m.species}</div></div>
      <div class="detail-row"><div class="detail-label">Status</div><div class="detail-value">${m.online ? '● online' : '○ offline'}</div></div>
      <div class="detail-row"><div class="detail-label">Actions</div>
        <button class="btn" onclick="document.getElementById('input').value='/dispatch ${this.esc(m.name)} '; document.getElementById('input').focus(); app.closeDetail()">Dispatch task</button>
        <button class="btn" onclick="document.getElementById('input').value='/dm ${this.esc(m.name)} '; document.getElementById('input').focus(); app.closeDetail()">Send DM</button>
      </div>`;
    document.getElementById('detail').classList.add('open');
  },

  showTask(id) {
    const t = this.tasks.find(x => x.id === id); if (!t) return;
    document.getElementById('detail-title').textContent = 'Task';
    document.getElementById('detail-body').innerHTML = `
      <div class="detail-row"><div class="detail-label">Title</div><div class="detail-value">${this.esc(t.title)}</div></div>
      <div class="detail-row"><div class="detail-label">State</div><div class="detail-value"><span class="task-state ${t.state}">${t.state}</span></div></div>
      <div class="detail-row"><div class="detail-label">Owner</div><div class="detail-value">${this.esc(t.owner || '-')}</div></div>
      <div class="detail-row"><div class="detail-label">Created by</div><div class="detail-value">${this.esc(t.created_by_name || t.created_by || '-')}</div></div>
      <div class="detail-row"><div class="detail-label">Origin</div><div class="detail-value">${this.esc(t.origin || '-')}</div></div>
      ${t.notes ? `<div class="detail-row"><div class="detail-label">Notes</div><div class="detail-value" style="white-space:pre-wrap">${this.esc(t.notes)}</div></div>` : ''}
      ${t.result ? `<div class="detail-row"><div class="detail-label">Result</div><div class="detail-value" style="white-space:pre-wrap">${this.esc(t.result)}</div></div>` : ''}
      <div class="detail-row"><div class="detail-label">ID</div><div class="detail-value">${this.esc(t.id)}</div></div>`;
    document.getElementById('detail').classList.add('open');
  },

  closeDetail() { document.getElementById('detail').classList.remove('open'); },
  scrollBottom() { const s = document.getElementById('stream'); s.scrollTop = s.scrollHeight; },
  toast(msg) { console.error(msg); alert(msg); },
  esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); },
  fmt(s) {
    let h = this.esc(s);
    h = h.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre>$2</pre>');
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return h;
  }
};
app.init();
</script>
</body>
</html>
