<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>同屋</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#f6f1e9">
<style>
/* ============================================================
   同屋 · 壳 v2 设计系统
   原则：token 定死刻度，页面只拼组件；暖纸底 + 松绿 accent；
   一致性靠系统，不靠每页用心。
   ============================================================ */
:root{
 /* 间距阶梯（4 的倍数） */
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
 /* 圆角阶梯 */
 --r-s:8px;--r-m:12px;--r-l:16px;--r-xl:22px;--r-pill:999px;
 /* 语义色 · 暖纸系 */
 --bg:#f4f1ea;            /* 房间地板 */
 --surface:#fdfcf8;       /* 纸面 */
 --surface-2:#f8f4ec;     /* 凹下去的面 */
 --ink:#2b2721;           /* 主文字 */
 --ink-2:#6e665a;         /* 次文字 */
 --ink-3:#a89e8e;         /* 弱提示 */
 --line:#e7dfd0;          /* 主线 */
 --line-2:#efe9db;        /* 次线 */
 --accent:#41735a;        /* 松绿 */
 --accent-strong:#355e48;
 --accent-ink:#ffffff;
 --accent-soft:#e7efe8;
 --at:#b08328;
 --danger:#c05a4b;--danger-soft:#f7edeb;
 --warn:#b98a2c;--warn-soft:#f8f1e2;
 --ok:#4a8f5d;
 --me:#d9e9da;            /* 我的气泡 */
 --dm:#f3eefb;--dm-line:#d8cdec;
 --fact:#f4efe5;
 /* 阴影刻度（低饱和暖灰，不用纯黑） */
 --sh-1:0 1px 2px rgba(74,62,42,.05),0 1px 3px rgba(74,62,42,.04);
 --sh-2:0 2px 6px rgba(74,62,42,.06),0 8px 20px rgba(74,62,42,.08);
 --sh-pop:0 8px 30px rgba(74,62,42,.16);
 /* 字 */
 --f-serif:"Noto Serif SC","Songti SC","SimSun",serif;
 --f-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
 --f-mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
 /* 动效 */
 --ease:cubic-bezier(.2,.8,.2,1);
 --dur:.18s;
 --dur-2:.28s;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-s)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-serif)}
::selection{background:var(--accent-soft)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 图标：内联 SVG 统一视觉重量 */
.ic,.ic svg{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.ic svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ===== 骨架：PC 左栏 / 手机底栏 ===== */
#app{display:flex;min-height:100%}
#rail{display:none}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:var(--s1) var(--s2) calc(var(--s1) + env(safe-area-inset-bottom))}
#tabbar.hidetab{display:none}
#tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;color:var(--ink-3);font-size:11px;letter-spacing:.02em;position:relative;border-radius:var(--r-m);transition:color var(--dur) var(--ease)}
#tabbar .tb.on{color:var(--accent)}
#tabbar .tb .badge{position:absolute;top:2px;left:calc(50% + 8px)}
@media(min-width:860px){
 #tabbar{display:none}
 #rail{display:flex;flex-direction:column;width:228px;flex:0 0 228px;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:var(--s5) var(--s3)}
 #rail .logo{font-family:var(--f-serif);font-size:20px;font-weight:600;padding:0 var(--s3) var(--s4);display:flex;align-items:center;gap:var(--s2);letter-spacing:.04em}
 #rail .logo .ic{color:var(--accent)}
 #rail .nav{display:flex;flex-direction:column;gap:2px}
 #rail .nav button{display:flex;align-items:center;gap:var(--s3);border-radius:var(--r-m);padding:10px var(--s3);font-size:14.5px;color:var(--ink-2);text-align:left;position:relative;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
 #rail .nav button:hover{background:var(--surface-2);color:var(--ink)}
 #rail .nav button.on{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
 #rail .nav button .badge{margin-left:auto;position:static}
 #rail .foot{margin-top:auto;padding:var(--s2) var(--s3);font-size:12.5px;color:var(--ink-3);display:flex;gap:var(--s2);align-items:center;border-top:1px solid var(--line-2);padding-top:var(--s3)}
}
main{flex:1;min-width:0;width:100%}
@media(min-width:860px){main{max-width:820px;margin:0 auto}}
.view{display:none;padding-bottom:84px;animation:viewin var(--dur-2) var(--ease)}
.view.on{display:block}
@keyframes viewin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(min-width:860px){.view{padding-bottom:48px}}

/* ===== 页头 ===== */
.hd{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3);display:flex;align-items:center;gap:var(--s3)}
.hd h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.03em}
.hd .sp{flex:1}
.hd .sub{font-size:12.5px;color:var(--ink-3)}
.back{padding:2px var(--s2) 2px 0;color:var(--ink);display:inline-flex}
.back .ic{width:24px;height:24px}
#dot{font-size:9px;color:var(--danger);transition:color var(--dur)}

/* ===== 通用件 ===== */
.badge{min-width:18px;height:18px;border-radius:var(--r-pill);background:var(--danger);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.pill{display:inline-flex;align-items:center;font-size:11px;border-radius:var(--r-pill);padding:2px 8px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.pill.ok{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
.pill.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:var(--danger-soft)}
.fact{font-family:var(--f-mono);font-size:12.5px;line-height:1.55;background:var(--fact);border:1px solid var(--line-2);border-radius:var(--r-s);padding:var(--s2) var(--s3);color:#5d564c;white-space:pre-wrap;word-break:break-word}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1)}
.secttl{font-family:var(--f-serif);font-size:13.5px;font-weight:600;color:var(--ink-2);letter-spacing:.06em;margin:var(--s5) var(--s1) var(--s2);display:flex;align-items:center;gap:var(--s2)}
.secttl::after{content:"";flex:1;height:1px;background:var(--line-2)}
.empty{color:var(--ink-3);font-size:13px;text-align:center;padding:var(--s8) 0;line-height:1.8}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px var(--s3)}
summary{cursor:pointer;color:var(--ink-2);font-size:13px;list-style:none;display:flex;align-items:center;gap:var(--s2)}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(-45deg);transition:transform var(--dur) var(--ease)}
details[open]>summary::before{transform:rotate(45deg)}

/* 骨架屏： shimmer */
.sk{position:relative;overflow:hidden;background:var(--surface-2);border-radius:var(--r-m)}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:skm 1.4s infinite}
@keyframes skm{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.sk-row{height:52px;margin:10px var(--s3)}

/* ===== 现在 ===== */
#whostrip{display:flex;gap:var(--s4);overflow-x:auto;padding:var(--s4) var(--s4) var(--s2);scrollbar-width:none}
#whostrip::-webkit-scrollbar{display:none}
.who{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;border-radius:var(--r-m);padding:2px;transition:transform var(--dur) var(--ease)}
.who:active{transform:scale(.94)}
.who .avw{position:relative;width:52px;height:52px}
.who .av{width:52px;height:52px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:var(--sh-1)}
.who .st{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#c9c1b3;border:2.5px solid var(--bg);transition:background var(--dur)}
.who.on .st{background:var(--ok)}
.who .nm{font-size:12px;color:var(--ink)}
.who.off .nm{color:var(--ink-3)}
#pending{margin:var(--s3) var(--s3) 0}
#feed{padding:var(--s2) var(--s3)}
.chips{display:flex;gap:var(--s2);padding:var(--s3) var(--s4) var(--s2);overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-f{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:5px 14px;font-size:13px;color:var(--ink-2);transition:all var(--dur) var(--ease)}
.chip-f:active{transform:scale(.96)}
.chip-f.on{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft);font-weight:600}
.ev{display:flex;gap:var(--s3);padding:11px var(--s2);border-bottom:1px solid var(--line-2)}
.ev .ic{width:34px;height:34px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.ev .ic svg{width:17px;height:17px}
.ev.err .ic{border-color:color-mix(in srgb,var(--danger) 45%,transparent);color:var(--danger);background:var(--danger-soft)}
.ev .bd{flex:1;min-width:0}
.ev .tt{font-size:14px;word-break:break-word;line-height:1.5}
.ev .mt{font-size:12px;color:var(--ink-3);margin-top:3px;display:flex;gap:var(--s2);flex-wrap:wrap}
.ev .tm{flex:0 0 auto;font-size:11px;color:var(--ink-3);padding-top:3px;font-variant-numeric:tabular-nums}

/* ===== 客厅 / 私聊 ===== */
#log{padding:var(--s3) var(--s3) 170px;display:flex;flex-direction:column;gap:10px}
#roomlog{padding:var(--s3) var(--s3) 96px;display:flex;flex-direction:column;gap:10px}
@media(min-width:860px){#log{padding-bottom:110px}}
.loadmore{align-self:center;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:var(--r-pill);padding:5px 15px;font-size:13px;transition:all var(--dur) var(--ease)}
.loadmore:hover{border-color:var(--ink-3)}
.ts{align-self:center;font-size:11.5px;color:var(--ink-3);margin:var(--s2) 0;letter-spacing:.03em}
.msg{display:flex;gap:var(--s2);align-items:flex-start;max-width:100%}
.msg.mine{flex-direction:row-reverse}
.av{flex:0 0 auto;width:38px;height:38px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.wrap{max-width:76%;display:flex;flex-direction:column;align-items:flex-start}
.mine .wrap{align-items:flex-end}
.n{font-size:11.5px;color:var(--ink-3);margin:0 2px 3px}
.b{position:relative;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-l);border-top-left-radius:var(--r-s);padding:9px 13px;box-shadow:var(--sh-1);white-space:pre-wrap;word-break:break-word;line-height:1.6}
.mine .b{background:var(--me);border-color:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:var(--r-l);border-top-right-radius:var(--r-s)}
.dmview .b{background:var(--dm);border-color:var(--dm-line)}
.b.atme{box-shadow:inset 0 0 0 1.5px var(--at),var(--sh-1)}
.at{color:var(--at);font-weight:600}
.sys{align-self:center;color:var(--ink-3);font-size:12.5px;max-width:92%;text-align:center;line-height:1.6}
.bar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:7;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:var(--s2) var(--s3);display:flex;gap:var(--s2);align-items:flex-end}
#view-room .bar{bottom:calc(0px + env(safe-area-inset-bottom))}
@media(min-width:860px){.bar{left:228px;bottom:0;padding-bottom:var(--s2)}#view-room .bar{bottom:0}}
.bar textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:var(--r-m);padding:9px var(--s3);font:inherit;background:var(--surface);max-height:120px;transition:border-color var(--dur)}
.bar textarea:focus{outline:none;border-color:var(--accent)}
.bar button.send{border-radius:var(--r-m);padding:0 var(--s4);height:38px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:6px;font-size:14px;transition:background var(--dur) var(--ease)}
.bar button.send:hover{background:#1f1c17}
.bar button.send .ic,.bar button.send .ic svg{width:16px;height:16px}
#atpop{position:fixed;left:var(--s3);right:var(--s3);bottom:64px;z-index:9;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-pop);overflow:hidden;animation:viewin var(--dur) var(--ease)}
@media(min-width:860px){#atpop{left:244px;max-width:460px}}
#atpop .opt{padding:10px var(--s4);font-size:15px;display:flex;gap:var(--s2);align-items:center;cursor:pointer}
#atpop .opt.hi,#atpop .opt:active{background:var(--fact)}
#atpop .opt .e{font-size:18px}
.bar .dlv{flex:0 0 auto;font-size:12px;padding:7px 10px;border-radius:var(--r-m);border:1px solid var(--line);background:transparent;color:var(--ink-2);transition:all var(--dur) var(--ease)}
.bar .dlv.on{background:#f0b254;border-color:#f0b254;color:#3d2c08;opacity:1;font-weight:600}

/* ===== 审批卡片 ===== */
.apcard{margin:var(--s1) 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px var(--s4);box-shadow:var(--sh-2)}
.apcard .apt{font-weight:600;margin-bottom:var(--s1);font-family:var(--f-serif);letter-spacing:.03em}
.apcard .apb{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.6}
.apcard .apm{font-size:12px;color:var(--ink-3);margin-top:6px;font-variant-numeric:tabular-nums}
.apbtns{display:flex;gap:10px;margin-top:var(--s3)}
.apbtns button{flex:1;border-radius:var(--r-m);padding:9px 0;font-size:15px;transition:all var(--dur) var(--ease)}
.apbtns .ok{background:var(--accent);color:#fff}
.apbtns .ok:hover{background:var(--accent-strong)}
.apbtns .no{background:var(--danger-soft);color:var(--danger)}
.apdone{margin-top:var(--s3);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}

/* ===== 房间列表 ===== */
#roomlist{padding:var(--s3);display:grid;gap:var(--s3)}
@media(min-width:700px){#roomlist{grid-template-columns:1fr 1fr}}
.door{display:flex;gap:13px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;cursor:pointer;box-shadow:var(--sh-1);position:relative;transition:box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease)}
.door:hover{box-shadow:var(--sh-2)}
.door:active{transform:scale(.985)}
.door .av{width:50px;height:50px;border-radius:var(--r-m);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:25px;border:1px solid var(--line-2)}
.door .mid{flex:1;min-width:0}
.door .nm{font-size:15.5px;font-weight:600;display:flex;gap:7px;align-items:center}
.door .st{font-size:12px;color:var(--ink-3);margin-top:2px}
.door i{width:7px;height:7px;border-radius:50%;background:#c9c1b3;display:inline-block;margin-right:6px}
.door.on i{background:var(--ok)}
.door .badge{position:absolute;top:10px;right:12px}

/* ===== 房间详情 ===== */
.roomhead{display:flex;gap:var(--s3);align-items:center;padding:14px var(--s4);border-bottom:1px solid var(--line);background:var(--bg)}
.roomhead .av{width:48px;height:48px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:var(--sh-1)}
.roomhead .nm{font-size:17px;font-weight:600;font-family:var(--f-serif)}
.roomhead .st{font-size:12px;color:var(--ink-3)}
.pills{position:sticky;top:calc(54px + env(safe-area-inset-top));display:flex;gap:7px;overflow-x:auto;padding:10px var(--s3);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:4;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill-tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:6px 15px;font-size:13.5px;color:var(--ink-2);transition:all var(--dur) var(--ease)}
.pill-tab.on{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft);font-weight:600}
.rpane{display:none}.rpane.on{display:block}
.rpane.pad{padding:var(--s3)}

/* 记忆 */
.mem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:11px var(--s3);margin-bottom:9px;transition:outline-color var(--dur)}
.mem.arch{opacity:.55}
.mem.sel{outline:2px solid var(--accent)}
.mem .ct{font-size:14.5px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.mem .mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center;font-size:11px;color:var(--ink-3)}
.cbar{width:52px;height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;display:inline-block;vertical-align:middle}
.cbar i{display:block;height:100%;background:var(--accent)}

/* 交接 */
.ho{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7}

/* 惦记 */
.li{display:flex;gap:9px;padding:10px var(--s1);border-bottom:1px solid var(--line-2);font-size:14.5px;line-height:1.6}
.li::before{content:"";flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:.62em}

/* 运行 */
.run{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:var(--s3);margin-bottom:10px;box-shadow:var(--sh-1)}
.run .rh{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.run .rt{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.run .rs{font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.run .rs svg{width:15px;height:15px;flex:0 0 auto}
.run .meta{font-size:12px;color:var(--ink-3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.run .reply{margin-top:9px;background:var(--accent-soft);border-radius:var(--r-m);padding:9px 11px;font-size:14px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.run .reply .lb,.run .heard .lb{font-size:11px;color:var(--ink-3);display:block;margin-bottom:3px;letter-spacing:.04em}
.run details{margin-top:9px}
.dg{display:flex;gap:6px;font-size:12.5px;border-radius:var(--r-s);padding:5px 9px;margin:4px 0 0;background:var(--accent-soft);color:var(--ink);align-items:baseline}
.dg b{color:var(--accent-strong);font-size:11px;letter-spacing:.04em}

/* 配置 */

$('#pgo').onclick=()=>{let l=$('#plink').value.trim();if(l){const u=new URL(l.replace('sameroof://','http://'));api=u.searchParams.get('api');tok=u.searchParams.get('token')}else{api=$('#papi').value.trim();tok=$('#ptok').value.trim()}if(!api||!tok)return alert('地址和token都要');W('api',api);W('token',tok);location.reload()};

/* ===== 请求 ===== */
const req=(m,p,b)=>fetch(api+p,{method:m,headers:{authorization:'Bearer '+tok,'content-type':'application/json'},body:b?JSON.stringify(b):undefined}).then(async r=>{const data=await r.json().catch(()=>({error:{message:'客厅返回了无法识别的响应'}}));if(r.status===401){localStorage.removeItem('token');ppair();throw new Error('钥匙失效了，重新配对进门')}if(!r.ok)throw new Error(data.error&&data.error.message||('请求失败 '+r.status));return data});

/* ===== 人 ===== */
const member=id=>byId[id]||{};
const name=id=>member(id).name||id||'？';
const emoji=id=>{const a=member(id).avatar;return (a&&a.emoji)||((member(id).name||'?').slice(0,1))};

/* ===== 时间 ===== */
const fmt=ts=>new Date(ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
const fmtFull=ts=>{const d=new Date(ts),today=new Date().toDateString()===d.toDateString();return (today?'':(d.getMonth()+1)+'月'+d.getDate()+'日 ')+fmt(ts)};
const divider=ts=>{const d=document.createElement('div');d.className='ts';d.textContent=fmtFull(ts);return d};

/* ===== 气泡 ===== */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function highlightAt(html){for(const m of [...members].sort((a,b)=>b.name.length-a.name.length)){html=html.split('@'+esc(m.name)).join('<span class="at">@'+esc(m.name)+'</span>')}return html}
function build(m){
 if(m.kind==='system'){
  let meta=null;try{meta=m.meta&&(typeof m.meta==='string'?JSON.parse(m.meta):m.meta)}catch(e){}
  if(meta&&meta.approval_id){
   if(meta.decision){const c=cards[meta.approval_id];if(c)c.settled(meta.decision,name(m.from_id));
    pending.delete(meta.approval_id);renderPending();
    const d=document.createElement('div');d.className='sys';d.textContent=String(m.text||'');return d}
   if(!pending.has(meta.approval_id)){pending.set(meta.approval_id,{m,meta});renderPending()}
   return approvalCard(m,meta)}
  const d=document.createElement('div');d.className='sys';d.textContent=String(m.text||'');return d}
 const mine=me&&m.from_id===me.id;
 const d=document.createElement('div');d.className='msg'+(mine?' mine':'');
 const av=document.createElement('div');av.className='av';av.textContent=emoji(m.from_id);
 const wrap=document.createElement('div');wrap.className='wrap';
 let nt=mine?'':name(m.from_id);
 if(nt){const n=document.createElement('div');n.className='n';n.textContent=nt;wrap.appendChild(n)}
 const b=document.createElement('div');b.className='b'+((m.mentions||[]).includes(me&&me.id)&&!mine?' atme':'');
 b.innerHTML=highlightAt(esc(String(m.text||'')));
 wrap.appendChild(b);d.append(av,wrap);return d}
function approvalCard(m,meta){
 const card=document.createElement('div');card.className='apcard';
 const t=document.createElement('div');t.className='apt';t.textContent='🙋 审批请求';
 const b=document.createElement('div');b.className='apb';b.textContent=String(m.text||'');
 const mi=document.createElement('div');mi.className='apm';mi.textContent='编号 '+meta.approval_id+(m.ts?' · '+fmtFull(m.ts):'');
 card.append(t,b,mi);
 const state={decision:null,settled:(decision,by)=>{state.decision=decision;pending.delete(meta.approval_id);
  for(const el of state.els){const btns=el.querySelector('.apbtns');if(btns)btns.remove();if(el.querySelector('.apdone'))continue;const r=document.createElement('div');r.className='apdone';r.textContent=decision==='allowed'?('✅ '+(by?by+' ':'')+'已同意'):decision==='expired'?'⌛ 已过期':('❌ '+(by?by+' ':'')+'已拒绝');el.appendChild(r)}}};
 state.els=[card];
 const prior=cards[meta.approval_id];
 if(prior){prior.els.push(card);if(prior.decision)state.decision=prior.decision;cards[meta.approval_id]=prior;state.settled=prior.settled;if(state.decision)state.settled(state.decision)}
 else cards[meta.approval_id]=state;
 const st=cards[meta.approval_id];
 st.m=m;st.meta=meta;
 if(!st.decision){
  if(me&&me.species==='human'){
   const btns=document.createElement('div');btns.className='apbtns';
   for(const [label,v,cls] of [['同意','allow','ok'],['拒绝','deny','no']]){const btn=document.createElement('button');btn.textContent=label;btn.className=cls;
    btn.onclick=()=>{for(const x of btns.children)x.disabled=true;req('POST','/approval/'+meta.approval_id,{decision:v}).then(()=>st.settled(v==='allow'?'allowed':'denied','我')).catch(e=>{alert(e.message);for(const x of btns.children)x.disabled=false})};
    btns.appendChild(btn)}
   card.appendChild(btns);
   req('GET','/approval/'+meta.approval_id).then(d=>{if(d.expires_ts)mi.textContent+=' · 有效期至 '+fmtFull(d.expires_ts);
    if(d.params&&typeof d.params==='object'&&!card.querySelector('.apparams')){const pr=document.createElement('div');pr.className='apm apparams';pr.style.whiteSpace='pre-wrap';pr.style.wordBreak='break-all';const pp={...d.params};if(typeof pp.content==='string'&&pp.content.length>200)pp.content=pp.content.slice(0,200)+'…('+d.params.content.length+' 字)';pr.textContent=(d.action||'')+' '+JSON.stringify(pp);card.insertBefore(pr,mi)}
    if(d.status&&d.status!=='pending')st.settled(d.status,d.decided_by&&name(d.decided_by))}).catch(()=>{});
  }else{const w=document.createElement('div');w.className='apm';w.textContent='等维护者决定…';card.appendChild(w)}
 }else st.settled(st.decision);
 return card}

/* ===== 审批卡下半截：网关执行结果（K5，缝见 2026-09-07 留条；activity meta.executed===true） ===== */
const EXEC_ST={succeeded:['🧾 已执行：成了','var(--accent)'],failed:['🧾 已执行：没办成','var(--red)'],denied:['🧾 被拒，没执行','var(--mute)'],expired:['🧾 过期了，没执行','var(--amber)'],timed_out:['🧾 已执行：超时了','var(--red)'],failed_unknown:['🧾 执行结果不明','var(--red)']};
function approvalExecuted(meta){
 const st=cards[meta.approval_id];if(!st)return;
 if(meta.status&&meta.status!=='succeeded'&&meta.status!=='denied'&&me&&me.species==='human'&&st.m&&!pending.has(meta.approval_id)){
  pending.set(meta.approval_id,{m:st.m,meta:st.meta});renderPending()}   // 没办成的顶回"等你拿主意"
 const [txt,color]=EXEC_ST[meta.status]||['🧾 已执行：'+String(meta.status||'?'),'var(--mute)'];
 const cov=meta.coverage&&meta.coverage.completed!=null?(' · '+String(meta.coverage.executor||'')+' '+meta.coverage.completed+'/'+(meta.coverage.requested!=null?meta.coverage.requested:'?')):'';
 const nxt=meta.next?(' · 下一步：'+(typeof meta.next==='string'?meta.next:(meta.next.kind||'有'))):'';
 for(const el of st.els){if(el.querySelector('.apexec'))continue;
  const r=document.createElement('div');r.className='apdone apexec';r.style.color=color;
  r.textContent=txt+cov+nxt;el.appendChild(r)}}


/* ===== 审批·从客厅拉待审（V2-AP）：刷新/断线后不靠 50 条历史碰运气 ===== */
async function loadPendingApprovals(){
 if(!(me&&me.species==='human'))return;
 let rows=[];try{rows=await req('GET','/approval?status=pending&limit=100')}catch(e){return}
 let changed=false;
 for(const a of rows){
  if(pending.has(a.approval_id))continue;
  const c=cards[a.approval_id];if(c&&c.decision)continue;
  const m={kind:'system',from_id:a.resident_id,text:(a.resident_name||a.resident_id)+' 想 '+a.action+'，等审批。',ts:a.created_ts};
  const meta={approval_id:a.approval_id,action:a.action,params_digest:a.params_digest,gateway_request_id:a.gateway_request_id,digest_kind:a.digest_kind,params:a.params};
  pending.set(a.approval_id,{m,meta});changed=true}
 if(changed)renderPending()}

/* ===== 审批·等维护者 ===== */
function renderPending(){
 const box=$('#pending');box.innerHTML='';
 if(!pending.size)return;
 const t=document.createElement('div');t.className='secttl';t.textContent=me&&me.species==='human'?'等你拿主意':'等维护者拿主意';
 box.appendChild(t);
 for(const {m,meta} of pending.values())box.appendChild(approvalCard(m,meta))}

/* ===== 视图切换 ===== */
function showView(v){curView=v;
 for(const x of document.querySelectorAll('.view'))x.classList.toggle('on',x.id==='view-'+v);
 const navKey=v==='room'?'rooms':v;
 for(const x of document.querySelectorAll('[data-tab]'))x.classList.toggle('on',x.dataset.tab===navKey);
 const inLounge=v==='lounge',inRoomDm=v==='room'&&roomTab==='dm';
 $('#loungebar').hidden=!inLounge;
 $('#roombar').hidden=!inRoomDm;

 window.scrollTo(0,inLounge||inRoomDm?document.body.scrollHeight:0);
 updateBadges();
 if(v==='now')loadFeed();
 if(v==='rooms')renderRoomList();
 if(v==='house')renderHouse();
 if(v==='runs')renderRunsView();
 if(v==='quota')renderQuotaView()}
for(const tb of document.querySelectorAll('[data-tab]'))tb.onclick=()=>showView(tb.dataset.tab);
function updateBadges(){
 const dmTotal=Object.values(dmStore).reduce((s,c)=>s+(c.unread||0),0);
 for(const id of['#nb-lounge','#tb-lounge']){const e=$(id);e.hidden=!loungeState.unread;e.textContent=loungeState.unread}
 for(const id of['#nb-rooms','#tb-rooms']){const e=$(id);e.hidden=!dmTotal;e.textContent=dmTotal}
 const total=loungeState.unread+dmTotal;
 document.title=total?('('+total+') 同屋'):'同屋'}

/* ===== 现在：事件流 ===== */
const EVICON={wake:'sunrise',sleep:'moon',model_call:'brain',config_change:'settings',approval_request:'bell',approval_result:'check',error:'zap',thread_update:'pin',note:'book-open'};
function evItem(a){
 const d=document.createElement('div');d.className='ev'+(a.kind==='error'?' err':'');
 const ic=document.createElement('div');ic.className='ic';ic.innerHTML=svgIc(EVICON[a.kind]||'circle-dot');
 const bd=document.createElement('div');bd.className='bd';
 const tt=document.createElement('div');tt.className='tt';tt.textContent=String(a.text||'');
 bd.appendChild(tt);
 const bits=[];
 if(a.kind==='model_call'&&a.meta){const mt=a.meta;if(mt.ms)bits.push((mt.ms/1000).toFixed(1)+'s');if(mt.usage&&mt.usage.total_tokens)bits.push(mt.usage.total_tokens+' tok');if(mt.model_calls>1)bits.push(mt.model_calls+' 次调用')}
 if(a.kind==='wake'&&a.meta&&a.meta.reason)bits.push(String(a.meta.reason));
 if(a.kind==='sleep'&&a.meta&&a.meta.wakes_today!=null)bits.push('今天第 '+a.meta.wakes_today+' 次醒');
 if(a.meta&&a.meta.error)bits.push('⚠️ '+String(a.meta.error));
 if(bits.length){const mt=document.createElement('div');mt.className='mt';mt.textContent=bits.join(' · ');bd.appendChild(mt)}
 const tm=document.createElement('div');tm.className='tm';tm.textContent=fmt(a.ts);
 d.append(ic,bd,tm);return d}
let feedLoaded=false,feedOldest=null,feedExhausted=false;
async function loadFeed(){
 if(feedLoaded)return;feedLoaded=true;
 $('#feed').innerHTML='<div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div>';
 try{const list=await req('GET','/activity?limit=60');
  for(const a of list)feedPush(a,true);
  if(list.length)feedOldest=list[list.length-1].seq;
  feedExhausted=list.length<60;
  renderFeed()}catch(e){$('#feed').innerHTML='<div class="empty">事件流还没接上：'+esc(e.message)+'</div>'}}
function feedPush(a,defer){
 if(feedSeen.has(a.seq))return;feedSeen.add(a.seq);
 if(a.seq>lastActSeq)lastActSeq=a.seq;
 if(a.kind==='approval_result'&&a.meta&&a.meta.executed)approvalExecuted(a.meta);
 feedItems.push(a);
 if(feedOldest===null||a.seq<feedOldest)feedOldest=a.seq;
 if(!defer)renderFeed()}
function renderFeed(){
 const box=$('#feed');box.innerHTML='';
 const filter=feedFilter?feedFilter.split(','):null;
 const items=feedItems.filter(a=>!filter||filter.includes(a.kind)).sort((a,b)=>b.seq-a.seq);
 if(!items.length){box.innerHTML='<div class="empty">还没有动静，房子刚醒来</div>';return}
 for(const a of items)box.appendChild(evItem(a));
 const more=$('#feedmore');more.hidden=feedExhausted}
for(const c of document.querySelectorAll('#feedchips .chip-f'))c.onclick=()=>{
 for(const x of document.querySelectorAll('#feedchips .chip-f'))x.classList.toggle('on',x===c);
 feedFilter=c.dataset.f;renderFeed()};
$('#feedmore').onclick=async()=>{
 try{const list=await req('GET','/activity?limit=60&before='+feedOldest);
  if(!list.length){feedExhausted=true;renderFeed();return}
  for(const a of list)feedPush(a,true);
  if(list.length<60)feedExhausted=true;
  renderFeed()}catch(e){alert(e.message)}};

/* ===== 客厅 ===== */
function loungeRender(msgs){const log=$('#log');log.innerHTML='';
 if(!loungeState.exhausted){const lm=document.createElement('button');lm.className='loadmore';lm.id='loungemore';lm.type='button';lm.textContent='加载更早的消息';lm.onclick=loungeMore;log.appendChild(lm)}
 if(!msgs.length){const e=document.createElement('div');e.className='empty';e.textContent='客厅里还静悄悄的';log.appendChild(e)}
 let prev=0;for(const m of msgs){const ts=Date.parse(m.ts)||0;if(prev&&ts-prev>FIVE_MIN)log.appendChild(divider(m.ts));prev=ts;log.appendChild(build(m))}
 loungeState.lastTs=prev;loungeState.firstSeq=msgs.length?msgs[0].seq:0}
async function loungeMore(){
 try{const older=await req('GET','/history?before='+(loungeState.firstSeq||MAXSEQ)+'&limit=50');
  if(!older.length){loungeState.exhausted=true;const lm=$('#loungemore');if(lm)lm.hidden=true;return}
  for(const m of older){if(m.id)seen.add(m.id)}
  loungeState.msgs=[...older.filter(m=>!loungeState.msgs.some(x=>x.id===m.id)),...loungeState.msgs];
  loungeState.firstSeq=loungeState.msgs[0].seq;
  const log=$('#log'),lm=$('#loungemore');
  const frag=document.createDocumentFragment();let prev=0;
  for(const m of older){const ts=Date.parse(m.ts)||0;if(prev&&ts-prev>FIVE_MIN)frag.appendChild(divider(m.ts));prev=ts;frag.appendChild(build(m))}
  if(prev&&loungeState.msgs[older.length]){const nxt=Date.parse(loungeState.msgs[older.length].ts);if(nxt-prev>FIVE_MIN)frag.appendChild(divider(loungeState.msgs[older.length].ts))}
  const h0=document.body.scrollHeight,y0=window.scrollY;
  log.insertBefore(frag,lm.nextSibling);
  window.scrollTo(0,y0+(document.body.scrollHeight-h0));
 }catch(e){alert(e.message)}}
const nearBottom=()=>window.innerHeight+window.scrollY>=document.body.scrollHeight-140;
function loungeAppend(m){
 const log=$('#log');const empty=log.querySelector('.empty');if(empty)empty.remove();
 const ts=Date.parse(m.ts)||Date.now();
 if(loungeState.lastTs&&ts-loungeState.lastTs>FIVE_MIN)log.appendChild(divider(m.ts));
 loungeState.lastTs=ts;
 const mine=me&&m.from_id===me.id,stay=nearBottom()||mine;
 log.appendChild(build(m));
 if(stay)window.scrollTo(0,document.body.scrollHeight)}

/* ===== 私信（房间·私聊页） ===== */
function dmGet(id){if(!dmStore[id])dmStore[id]={msgs:[],firstSeq:0,exhausted:false,unread:0,loaded:false};return dmStore[id]}
async function dmLoad(id){const d=dmGet(id);if(d.loaded)return;d.loaded=true;
 const list=await req('GET','/dm/history?with='+encodeURIComponent(id)+'&limit=50');
 for(const m of list)if(!d.msgs.some(x=>x.id===m.id))d.msgs.push(m);
 d.msgs.sort((a,b)=>a.seq-b.seq);d.firstSeq=d.msgs.length?d.msgs[0].seq:0;d.exhausted=list.length<50}
function dmRender(id){const d=dmGet(id),log=$('#roomlog');log.innerHTML='';
 if(!d.exhausted){const lm=document.createElement('button');lm.className='loadmore';lm.type='button';lm.textContent='加载更早的悄悄话';lm.onclick=()=>dmMore(id);log.appendChild(lm)}
 if(!d.msgs.length){const e=document.createElement('div');e.className='empty';e.textContent='和 '+name(id)+' 的悄悄话从这里开始';log.appendChild(e)}
 let prev=0;for(const m of d.msgs){const ts=Date.parse(m.ts)||0;if(prev&&ts-prev>FIVE_MIN)log.appendChild(divider(m.ts));prev=ts;log.appendChild(build(m))}
 d.lastTs=prev}
async function dmMore(id){const d=dmGet(id);
 try{const older=await req('GET','/dm/history?with='+encodeURIComponent(id)+'&before='+(d.firstSeq||MAXSEQ)+'&limit=50');
  if(!older.length){d.exhausted=true;dmRender(id);return}
  for(const m of older){if(m.id)seen.add(m.id);if(!d.msgs.some(x=>x.id===m.id))d.msgs.unshift(m)}
  d.msgs.sort((a,b)=>a.seq-b.seq);d.firstSeq=d.msgs[0].seq;
  if(older.length<50)d.exhausted=true;
  const h0=document.body.scrollHeight,y0=window.scrollY;
  dmRender(id);
  window.scrollTo(0,y0+(document.body.scrollHeight-h0))}catch(e){alert(e.message)}}
function dmAppend(id,m){const d=dmGet(id);d.msgs.push(m);
 if(curView==='room'&&roomId===id&&roomTab==='dm'){
  const log=$('#roomlog');const empty=log.querySelector('.empty');if(empty)empty.remove();
  const ts=Date.parse(m.ts)||Date.now();
  if(d.lastTs&&ts-d.lastTs>FIVE_MIN)log.appendChild(divider(m.ts));
  d.lastTs=ts;
  const mine=me&&m.from_id===me.id,stay=nearBottom()||mine;
  log.appendChild(build(m));
  if(stay)window.scrollTo(0,document.body.scrollHeight)}
 else if(me&&m.from_id!==me.id){d.unread++;updateBadges();if(curView==='rooms')renderRoomList()}}
function ackDm(d){const ids=d.msgs.filter(m=>m.kind==='dm'&&me&&m.from_id!==me.id).map(m=>m.id).filter(Boolean);if(ids.length)req('POST','/inbox/ack',{ids}).catch(()=>{})}

/* ===== 收消息总线 ===== */
function receive(m,silent){
 if(m.type==='activity')return feedPush(m);
 if(m.id){if(seen.has(m.id))return;seen.add(m.id)}
 if(m.seq&&m.seq>lastSeq)lastSeq=m.seq;
 if(m.kind==='dm'){const other=me&&m.from_id===me.id?m.to_id:m.from_id;dmAppend(other,m);return}
 loungeState.msgs.push(m);
 if(curView==='lounge'){loungeAppend(m)}
 else if(!silent){loungeState.unread++;updateBadges()}}

/* ===== 发送 ===== */
// 投递模式（维护者 9/6）：默认“等他忙完”（after_turn），点一下变“现在就说”（interrupt）；记在本机，随消息带 deliver 字段
let _dlv='after_turn';try{_dlv=localStorage.getItem('deliver')||'after_turn'}catch{}
function deliverMode(){return _dlv}
function paintDlv(){for(const b of document.querySelectorAll('.dlv')){b.textContent=_dlv==='interrupt'?'现在就说':'等他忙完';b.classList.toggle('on',_dlv==='interrupt')}}
for(const b of document.querySelectorAll('.dlv'))b.addEventListener('click',()=>{_dlv=_dlv==='interrupt'?'after_turn':'interrupt';try{localStorage.setItem('deliver',_dlv)}catch{}paintDlv()});paintDlv();
async function sendLounge(){const t=$('#in').value.trim();if(!t)return;$('#in').value='';grow($('#in'));hideAt();
 try{const m=await req('POST','/say',{text:t,deliver:deliverMode()});receive(m,true)}catch(e){$('#in').value=t;grow($('#in'));alert(e.message)}}
async function sendDm(){const t=$('#dmin').value.trim();if(!t||!roomId)return;$('#dmin').value='';grow($('#dmin'));
 try{const m=await req('POST','/dm',{to:roomId,text:t,deliver:deliverMode()});receive(m,true)}catch(e){$('#dmin').value=t;grow($('#dmin'));alert(e.message)}}
$('#send').onclick=sendLounge;$('#dmsend').onclick=sendDm;
function grow(ta){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px'}

/* ===== @ 补全（仅客厅） ===== */
let atList=[],atHi=0;
const atEnd=/@[^\s@，,。！!？?：:；;]*$/;
function onAt(){const ta=$('#in');const mm=ta.value.slice(0,ta.selectionStart).match(atEnd);
 if(!mm)return hideAt();
 const frag=mm[0].slice(1);
 atList=members.filter(x=>(!me||x.id!==me.id)&&(!frag||x.name.includes(frag)));
 if(!atList.length)return hideAt();
 atHi=0;const pop=$('#atpop');pop.innerHTML='';
