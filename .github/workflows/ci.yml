name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      SAMEROOF_CI_MOCK_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Install sandbox runtime (bubblewrap)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: All package tests
        run: npm test
      - name: Demo smoke (mock mode, no API key)
        run: node examples/code-review/demo.js | tail -5
      - name: CLI smoke
        run: |
          node packages/cli/index.js init /tmp/ci-ws
          node packages/cli/index.js new bot --model zhipu/glm-4-flash --house /tmp/ci-ws
          node packages/cli/index.js new me --human --house /tmp/ci-ws
          node packages/cli/index.js check --house /tmp/ci-ws
          ls /tmp/ci-ws/rooms
